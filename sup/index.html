<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoumihEdu — Supplément par code</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2064%2064%27%3E%3Crect%20width=%2764%27%20height=%2764%27%20rx=%2714%27%20fill=%27%2317213A%27/%3E%3Cpath%20d=%27M44%2022a15%2015%200%201%200%202%2016H33%27%20fill=%27none%27%20stroke=%27%23F2B705%27%20stroke-width=%277%27%20stroke-linecap=%27round%27/%3E%3Ccircle%20cx=%2748%27%20cy=%2748%27%20r=%275%27%20fill=%27%23F26B1D%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5EF;--ink:#17213A;--ink-2:#4A5470;--line:#D9D7CB;--panel:#fff;--acc:#F2B705;--ko:#B3392B;--ok:#2E7D4F;--kotlin:#7F52FF}
@media (prefers-color-scheme:dark){:root{--bg:#12161F;--ink:#E8EBF0;--ink-2:#A3ACBD;--line:#2C333F;--panel:#1B212C}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,Noto Color Emoji,sans-serif}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 24px;width:min(440px,100%);text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.12)}
.mark{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:26px;margin:0}
.mark b{color:var(--acc)}
.box p{color:var(--ink-2);margin:8px 0 18px}
.code{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.code input{width:46px;height:58px;text-align:center;font-size:28px;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.code input:focus{outline:none;border-color:var(--kotlin);box-shadow:0 0 0 3px color-mix(in srgb,var(--kotlin) 25%,transparent)}
button.go{width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
.msg{min-height:1.4em;margin-top:12px;font-weight:600}
.msg.ko{color:var(--ko)}.msg.ok{color:var(--ok)}
.foot{font-size:12px;color:var(--ink-2);margin-top:16px}
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar b{font-size:15px;flex:1;min-width:180px}
.bar small{color:var(--ink-2)}
.bar button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
iframe{flex:1;width:100%;border:0;background:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form class="box" id="f" autocomplete="off">
    <h1 class="mark">Goumih<b>Edu</b></h1>
    <p>Saisissez le <b>code à 6 chiffres</b> donné par votre formateur pour ouvrir le supplément interactif.</p>
    <div class="code" id="code"></div>
    <button class="go" id="go" type="submit" disabled>Ouvrir le supplément</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="foot">Accès réservé aux stagiaires du CMC — ne partagez pas ce code en dehors du groupe.<br><a href="../" style="color:inherit">← Espace stagiaires</a></div>
  </form>
</div>
<div class="view" id="view" hidden>
  <div class="bar"><b id="vt"></b><small id="vp"></small><button type="button" id="fs">⛶ Plein écran</button><button type="button" id="out">✕ Changer de code</button></div>
  <iframe id="fr" title="Supplément interactif" allow="fullscreen; clipboard-write"></iframe>
</div>
<script>
(function(){
  var N=6,box=document.getElementById('code'),go=document.getElementById('go'),msg=document.getElementById('msg'),timer=null,cur=null;
  for(var i=0;i<N;i++){var x=document.createElement('input');x.inputMode='numeric';x.maxLength=1;x.setAttribute('aria-label','Chiffre '+(i+1));x.pattern='[0-9]';box.appendChild(x)}
  var I=[].slice.call(box.querySelectorAll('input'));
  function val(){return I.map(function(x){return x.value}).join('')}
  function upd(){go.disabled=!/^\d{6}$/.test(val())}
  function fill(c){c=String(c||'').replace(/\D/g,'').slice(0,N);I.forEach(function(x,k){x.value=c[k]||''});upd()}
  I.forEach(function(x,k){
    x.addEventListener('input',function(){var v=x.value.replace(/\D/g,'');if(v.length>1){fill(val().slice(0,k)+v);(I[Math.min(N-1,k+v.length)]).focus();return}x.value=v;if(v&&k<N-1)I[k+1].focus();upd();msg.textContent=''});
    x.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!x.value&&k>0){I[k-1].focus();I[k-1].value='';upd()}else if(e.key==='ArrowLeft'&&k>0)I[k-1].focus();else if(e.key==='ArrowRight'&&k<N-1)I[k+1].focus()});
    x.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text');if(t){e.preventDefault();fill(t);if(/^\d{6}$/.test(val()))open(val())}});
    x.addEventListener('focus',function(){x.select()})});
  function hex(buf){return [].map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
  function hash(c){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('ge-sup:'+c)).then(function(b){return hex(b).slice(0,24)})}
  function fmt(t){var d=new Date(t);return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',timeZone:'Africa/Casablanca'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Casablanca'})}
  function meta(html){var m=html.match(/<meta name="ge-sup" content="([^"]+)"/);if(!m)return null;try{return JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){return null}}
  function say(t,k){msg.className='msg '+(k||'');msg.textContent=t}
  function open(c){if(!/^\d{6}$/.test(c))return;go.disabled=true;say('⏳ Vérification du code…');
    hash(c).then(function(h){return fetch('../fichiers/sup-'+h+'.html',{cache:'no-store'})}).then(function(r){if(r.status===404)throw 'inconnu';if(!r.ok)throw 'reseau';return r.text()}).then(function(html){
      var M=meta(html)||{},now=Date.now();
      if(M.debut&&now<M.debut)throw 'avant:'+M.debut;if(M.fin&&now>M.fin)throw 'apres:'+M.fin;
      try{localStorage.setItem('ge-sup-last',c)}catch(e){}
      cur={c:c,M:M};document.getElementById('vt').textContent='📘 '+(M.titre||'Supplément');document.getElementById('vp').textContent=M.fin?'Accès jusqu’au '+fmt(M.fin):'';
      document.title=(M.titre||'Supplément')+' — GoumihEdu';
      var fr=document.getElementById('fr');fr.srcdoc=html;document.getElementById('gate').hidden=true;document.getElementById('view').hidden=false;
      try{history.replaceState(null,'',location.pathname)}catch(e){}
      clearInterval(timer);if(M.fin)timer=setInterval(function(){if(Date.now()>M.fin){close();say('⌛ Le temps d’accès à ce supplément est terminé.','ko')}},30000);
    }).catch(function(e){e=String(e);upd();
      if(e==='inconnu')say('❌ Code inconnu, ou supplément retiré par le formateur.','ko');
      else if(e.indexOf('avant:')===0)say('⏳ Ce supplément sera disponible à partir du '+fmt(+e.slice(6))+'.','ko');
      else if(e.indexOf('apres:')===0)say('⌛ Accès terminé depuis le '+fmt(+e.slice(6))+'.','ko');
      else say('⚠️ Connexion impossible. Vérifiez Internet puis réessayez.','ko')})}
  function close(){clearInterval(timer);document.getElementById('fr').srcdoc='';document.getElementById('view').hidden=true;document.getElementById('gate').hidden=false;document.title='GoumihEdu — Supplément par code';fill('');I[0].focus()}
  document.getElementById('f').onsubmit=function(e){e.preventDefault();open(val())};
  document.getElementById('out').onclick=function(){try{localStorage.removeItem('ge-sup-last')}catch(e){}close();say('')};
  document.getElementById('fs').onclick=function(){var v=document.getElementById('view');if(document.fullscreenElement)document.exitFullscreen();else if(v.requestFullscreen)v.requestFullscreen()};
  var m=location.hash.match(/c=(\d{6})/);var last=null;try{last=localStorage.getItem('ge-sup-last')}catch(e){}
  if(m){fill(m[1]);open(m[1])}else if(last){fill(last);open(last)}else I[0].focus();
})();
</script>
</body>
</html>
