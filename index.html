<footer id="foot"></footer></div><script>var D={"genere":"2026-09-29T11:58:01.100Z","formateur":"M. Goumih — OFPPT CMC Agadir","groups":[{"id":"devoam201","nom":"DEVOAM201","edt":[{"jour":"Lundi","creneaux":[{"debut":"08:00","fin":"13:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Mardi","creneaux":[{"debut":"13:30","fin":"18:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Mercredi","creneaux":[{"debut":"08:00","fin":"13:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Jeudi","creneaux":[{"debut":"13:30","fin":"18:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Samedi","creneaux":[{"debut":"08:00","fin":"13:00","salle":"DIA7","remarque":"","freq":""}]}]}],"avancement":[{"code":"M202","libelle":"Programmation sous Android","groupId":"devoam201","pct":79,"fait":71.5,"mh":90}],"consignes":[{"titre":"preparation Tps","emoji":"🛠️","type":"TP à rendre","desc":"pour la séance de jeudi vos préparer vos codes pour expliquer  les solutions avec aussi solutions alrenatives  et les questions de vos collègues et votre formateur","date":"2026-10-01","groupIds":["devoam201"],"liens":[]}],"corrections":[],"supplements":[{"titre":"Injection de dépendances","date":"2026-09-29","groupIds":["devoam201"],"html":"<h3>L’injection de dépendances en Kotlin<\/h3><p>Une classe ne fabrique pas elle-même les objets dont elle a besoin (base de données, envoi de messages, journal…) : on les lui fournit de l’extérieur, le plus souvent par son constructeur. Le code devient interchangeable, testable et plus simple à faire évoluer.<\/p><h4>1. Le problème : le couplage fort<\/h4><h5>Sans injection<\/h5><pre>class CommandeService {\n    // La classe fabrique elle-même ses dépendances\n    private val repo = MySqlCommandeRepository()\n    private val notif = EmailNotificateur()\n\n    fun passer(client: String, total: Double) {\n        val c = Commande(client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nfun main() {\n    val service = CommandeService()   // aucun choix possible ici\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><p class=\"nt\">Pour changer de base de données, il faut modifier CommandeService ; en test, impossible d’éviter la vraie base et l’envoi d’e-mails.<\/p><h5>Avec injection<\/h5><pre>interface CommandeRepository { fun sauvegarder(c: Commande) }\ninterface Notificateur { fun envoyer(dest: String, msg: String) }\n\nclass CommandeService(\n    private val repo: CommandeRepository,   // reçu, pas créé\n    private val notif: Notificateur\n) {\n    fun passer(client: String, total: Double) {\n        val c = Commande(client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nfun main() {\n    val service = CommandeService(MySqlCommandeRepository(), EmailNotificateur())\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><p class=\"nt\">CommandeService dépend d’interfaces ; seul main choisit les classes concrètes.<\/p><h4>2. L’assembleur (composition root)<\/h4><pre>class CommandeService(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur,\n    private val journal: Journal\n) {\n    fun passer(client: String, total: Double): Commande {\n        journal.log(&quot;Nouvelle commande de $client&quot;)\n        val c = Commande(id = repo.prochainId(), client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande #${c.id} confirmée&quot;)\n        return c\n    }\n}\n\n// Assembleur (composition root) : le SEUL endroit qui connaît les classes concrètes\nfun main() {\n    val repo: CommandeRepository = MySqlCommandeRepository(&quot;jdbc:mysql://localhost/resto&quot;)\n    val notif: Notificateur = EmailNotificateur()\n    val journal: Journal = ConsoleJournal()\n\n    val service = CommandeService(repo, notif, journal)\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><h4>3. Trois façons d’injecter<\/h4><h5>Par constructeur<\/h5><pre>class CommandeService(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur\n) {\n    fun passer(client: String, total: Double) { /* … */ }\n}\n\nval service = CommandeService(MySqlCommandeRepository(), EmailNotificateur())<\/pre><p>La méthode recommandée. Les dépendances sont visibles dans la signature, obligatoires et non modifiables (val) : l’objet est complet dès sa création.<\/p><ul><li>Avantage : Impossible d’oublier une dépendance<\/li><li>Avantage : Propriétés en val, objet immuable<\/li><li>Avantage : Test direct : on passe des faux au constructeur<\/li><li>Limite : Constructeur long si beaucoup de dépendances (signe qu’une classe en fait trop)<\/li><\/ul><h5>Par propriété<\/h5><pre>class CommandeService {\n    lateinit var repo: CommandeRepository\n    lateinit var notif: Notificateur\n\n    fun passer(client: String, total: Double) { /* … */ }\n}\n\nval service = CommandeService()\nservice.repo = MySqlCommandeRepository()\nservice.notif = EmailNotificateur()<\/pre><p>Utile quand on ne contrôle pas la création de l’objet (Activity ou Fragment Android créés par le système) : le framework remplit la propriété après coup (@Inject lateinit var avec Hilt).<\/p><ul><li>Avantage : Seule option quand le système crée l’objet<\/li><li>Limite : Oubli possible : UninitializedPropertyAccessException à l’exécution<\/li><li>Limite : Propriété modifiable (var)<\/li><\/ul><h5>Par méthode / paramètre<\/h5><pre>class CommandeService {\n    fun passer(\n        client: String,\n        total: Double,\n        repo: CommandeRepository,\n        notif: Notificateur\n    ) {\n        repo.sauvegarder(Commande(client, total))\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nservice.passer(&quot;Amina&quot;, 250.0, MySqlCommandeRepository(), EmailNotificateur())<\/pre><p>La dépendance n’est fournie que pour un appel. Pertinent quand elle change à chaque appel (un format d’export, une stratégie de calcul) : c’est le patron Stratégie.<\/p><ul><li>Avantage : Très flexible, appel par appel<\/li><li>Limite : Chaque appelant doit fournir les dépendances<\/li><li>Limite : Signatures chargées<\/li><\/ul><h4>4. Tester avec de fausses dépendances<\/h4><pre>class FauxRepository : CommandeRepository {\n    val sauvees = mutableListOf&lt;Commande&gt;()\n    override fun prochainId() = sauvees.size + 1\n    override fun sauvegarder(c: Commande) { sauvees += c }\n}\nclass FauxNotificateur : Notificateur {\n    val envoyes = mutableListOf&lt;String&gt;()\n    override fun envoyer(dest: String, msg: String) { envoyes += &quot;$dest : $msg&quot; }\n}\n\nclass CommandeServiceTest {\n    @Test\n    fun passerUneCommandeLaSauvegarde() {\n        val repo = FauxRepository()\n        val notif = FauxNotificateur()\n        val service = CommandeService(repo, notif, SilencieuxJournal())\n\n        service.passer(&quot;Amina&quot;, 250.0)\n\n        assertEquals(1, repo.sauvees.size)\n        assertEquals(250.0, repo.sauvees[0].total)\n        assertEquals(listOf(&quot;Amina : Commande #1 confirmée&quot;), notif.envoyes)\n    }\n}<\/pre><h4>5. Un conteneur fait maison<\/h4><pre>object Conteneur {\n    // single : créé au premier accès, puis toujours le même\n    val repo: CommandeRepository by lazy { EnMemoireCommandeRepository() }\n\n    // factory\n    fun notificateur(): Notificateur = EmailNotificateur()\n\n    val service by lazy {\n        CommandeService(repo, notificateur(), ConsoleJournal())\n    }\n}\n\nfun main() {\n    Conteneur.service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><ul><li>single (by lazy) : l’objet est créé au premier accès puis toujours réutilisé<\/li><li>factory (fun) : un nouvel objet à chaque appel<\/li><\/ul><h4>6. Avec un framework<\/h4><h5>Koin<\/h5><pre>// build.gradle.kts : implementation(&quot;io.insert-koin:koin-android:3.5.6&quot;)\n\nval appModule = module {\n    single&lt;CommandeRepository&gt; { RoomCommandeRepository(get()) }\n    factory&lt;Notificateur&gt; { EmailNotificateur() }\n    single&lt;Journal&gt; { ConsoleJournal() }\n    single { CommandeService(get(), get(), get()) }\n    viewModel { CommandeViewModel(get()) }\n}\n\nclass RestoApp : Application() {\n    override fun onCreate() {\n        super.onCreate()\n        startKoin {\n            androidContext(this@RestoApp)\n            modules(appModule)\n        }\n    }\n}\n\nclass CommandeActivity : AppCompatActivity() {\n    private val vm: CommandeViewModel by viewModel()\n}<\/pre><p>Koin décrit le graphe en Kotlin pur : single pour une instance unique, factory pour une nouvelle à chaque demande, get() pour résoudre une dépendance. Pas d’annotation ni de génération de code. En contrepartie, une dépendance oubliée n’est détectée qu’au lancement de l’application.<\/p><h5>Hilt<\/h5><pre>@HiltAndroidApp\nclass RestoApp : Application()\n\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class DonneesModule {\n    @Binds @Singleton\n    abstract fun repo(impl: RoomCommandeRepository): CommandeRepository\n    @Binds\n    abstract fun notif(impl: EmailNotificateur): Notificateur\n}\n\nclass CommandeService @Inject constructor(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur\n)\n\n@HiltViewModel\nclass CommandeViewModel @Inject constructor(\n    private val service: CommandeService\n) : ViewModel()\n\n@AndroidEntryPoint\nclass CommandeActivity : AppCompatActivity() {\n    private val vm: CommandeViewModel by viewModels()\n}<\/pre><p>Hilt (basé sur Dagger) génère le code d’assemblage à la compilation : @Inject constructor dit comment créer une classe, @Binds ou @Provides relie une interface à son implémentation, @Singleton fixe la portée. Une dépendance manquante est une erreur de compilation. C’est la solution recommandée par Google pour Android.<\/p><h5>À la main (rappel)<\/h5><pre>object Conteneur {\n    val repo: CommandeRepository by lazy { EnMemoireCommandeRepository() }\n    fun notificateur(): Notificateur = EmailNotificateur()\n    val service by lazy { CommandeService(repo, notificateur(), ConsoleJournal()) }\n}\n\nclass CommandeActivity : AppCompatActivity() {\n    private val service = Conteneur.service\n}<\/pre><p>Les frameworks automatisent exactement ce que fait ce conteneur fait maison. Comprendre la version manuelle permet de comprendre Koin et Hilt : ils ne font rien de magique.<\/p><div class=\"tw\"><table><tr><th><\/th><th>À la main<\/th><th>Koin<\/th><th>Hilt (Dagger)<\/th><\/tr><tr><td>Principe<\/td><td>Constructeur + objet assembleur<\/td><td>DSL Kotlin : module { single { } factory { } }<\/td><td>Annotations (@Inject, @Module, @Provides), code généré<\/td><\/tr><tr><td>Vérification<\/td><td>À la compilation<\/td><td>À l’exécution (erreur au démarrage si une dépendance manque)<\/td><td>À la compilation<\/td><\/tr><tr><td>Mise en place<\/td><td>Aucune bibliothèque<\/td><td>Légère, rapide à apprendre<\/td><td>Plus lourde (kapt/ksp, plugin Gradle)<\/td><\/tr><tr><td>Idéal pour<\/td><td>Petits projets, apprendre le principe<\/td><td>Projets Kotlin / Android de taille moyenne, KMP<\/td><td>Grosses applications Android (recommandé par Google)<\/td><\/tr><\/table><\/div><h4>Exercices corrigés<\/h4><ul><li>1. Qu’est-ce qu’une dépendance d’une classe ? — Réponse : Un objet dont elle a besoin pour fonctionner. Ex. : CommandeService a besoin d’un repository et d’un notificateur.<\/li><li>2. Quelle forme d’injection est recommandée par défaut ? — Réponse : Par constructeur. Dépendances obligatoires, visibles, en val.<\/li><li>3. Pourquoi CommandeService doit-il dépendre d’une interface CommandeRepository ? — Réponse : Pour pouvoir changer d’implémentation sans modifier la classe. MySQL, Room ou une fausse base en test : même contrat.<\/li><li>4. Où doit-on créer les classes concrètes (MySql…, Email…) ? — Réponse : Dans l’assembleur (main, Application, module DI). C’est la « composition root ».<\/li><li>5. Dans Koin, que fait single { … } ? — Réponse : Fournit toujours la même instance. factory { } crée une nouvelle instance à chaque fois.<\/li><li>6. Que se passe-t-il avec by lazy dans un conteneur ? — Réponse : L’objet est créé au premier accès puis réutilisé. C’est un single « paresseux ».<\/li><li>7. Principal intérêt de l’injection pour les tests ? — Réponse : Remplacer les vraies dépendances par des fausses (fakes). Tests rapides, sans base ni réseau, et vérifiables.<\/li><li>8. Avec Hilt, que signifie @Inject constructor(…) ? — Réponse : Hilt sait créer cette classe en fournissant ses paramètres. La portée se fixe avec @Singleton ou un composant.<\/li><\/ul>"}],"parties":[{"id":"mulq33yukma1q","titre":"terminer POO kotlin","module":"M202 — Programmation sous Android","date":"2026-09-28","groupIds":["devoam201"],"stats":{"tot":0,"ok":1,"moins":0,"n":1},"importe":"29/09/2026 00:56:28"}],"fbform":{"action":"https://docs.google.com/forms/d/e/1FAIpQLScqMnYL1cf00nqEcj4BqiBztPjqpRHHlq5-HrzE5jiT4UzAdQ/formResponse","eGroupe":"entry.610708266","ePartie":"entry.265603128","eNiveau":"entry.882253406","eRemarque":"entry.273424288","labels":["totalement compris","compris","moins compris"],"extra":[{"key":"entry.1330982699","label":"NOM ET PRENOM"}]},"infos":[{"texte":"presentations projet 1","date":"2026-11-19","prio":"normale","epingle":false,"groupIds":[]},{"texte":"presentations Excel","date":"2026-11-20","prio":"normale","epingle":false,"groupIds":[]},{"texte":"debut seances FAD","date":"2026-11-07","prio":"important","epingle":true,"groupIds":["devoam201"]}],"ech":[{"date":"2026-09-30","heure":"","type":"Rattrapage","module":"M202","salle":"DIA7","groupId":"devoam201"},{"date":"2026-10-07","heure":"10:30","type":"Contrôle","module":"M202","salle":"DIA7","groupId":"mujsli9rb2194"},{"date":"2026-10-07","heure":"10:30","type":"Contrôle","module":"M202 :controle 2","salle":"DIA7","groupId":"devoam201"},{"date":"2026-10-10","heure":"","type":"Contrôle","module":"M202:controle3","salle":"DIA7","groupId":"devoam201"}],"cal":[{"type":"ferie","label":"Mar
