*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}.wrap{max-width:760px;margin:0 auto;padding:0 18px 60px}header{padding:26px 0 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.mark{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:28px;letter-spacing:-.02em}.mark b{background:var(--accent);color:var(--accent-ink);padding:0 5px;border-radius:4px}.stripe{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--kotlin) 0 20%,var(--dart) 20% 40%,var(--android) 40% 60%,var(--orange) 60% 80%,var(--accent) 80% 100%)}select{font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:19px;font-weight:600;margin:26px 0 8px;display:flex;align-items:center;gap:8px}h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dot)}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px}.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.muted{color:var(--ink-2);font-size:14px}.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 7px;color:#fff;background:var(--dart);vertical-align:middle}.tag.o{background:var(--orange)}.tag.a{background:var(--accent);color:var(--accent-ink)}.tag.k{background:var(--ko)}.tag.h{background:var(--kotlin)}.empty{color:var(--ink-2);padding:10px 0}.fb{padding:12px 0;border-bottom:1px solid var(--line)}.fb:last-child{border-bottom:0}.fb .t{font-weight:600}.fb .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fb .btns button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}.fb .btns button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}.fb textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:8px;margin-top:8px;min-height:60px;background:var(--panel);color:var(--ink)}.fb .send{font:inherit;font-weight:600;border:0;background:var(--kotlin);color:#fff;border-radius:999px;padding:8px 16px;margin-top:8px;cursor:pointer}.fb .send[disabled]{opacity:.5}.fb .done{color:var(--ok);font-weight:600;margin-top:8px}.fbbar{display:inline-flex;width:160px;height:10px;border-radius:5px;overflow:hidden;background:var(--line);vertical-align:middle}.fbbar i{display:block;height:100%}.spb h3{font-size:19px;margin:12px 0 6px}.spb h4{font-size:16px;margin:16px 0 6px;color:var(--kotlin)}.spb h5{font-size:14px;margin:10px 0 4px}.spb p{margin:6px 0}.spb .nt{background:rgba(242,183,5,.15);border-radius:8px;padding:6px 10px}.spb ul{margin:6px 0;padding-left:20px}.spb .tw{overflow-x:auto}.spb table{border-collapse:collapse;font-size:13.5px;margin:6px 0}.spb th,.spb td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}.spb th{background:var(--kotlin);color:#fff}.co{padding:10px 0;border-bottom:1px solid var(--line)}.co:last-child{border-bottom:0}.co summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}.co summary::-webkit-details-marker{display:none}.co summary b::before{content:"▸ ";color:var(--ok)}.co[open] summary b::before{content:"▾ "}.co pre{background:#1E1B2E;color:#E8E4F5;border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;line-height:1.5;margin:8px 0 0;white-space:pre}.co .cp{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 10px;margin-top:6px;cursor:pointer}.cs{padding:12px 0;border-bottom:1px solid var(--line)}.cs:last-child{border-bottom:0}.cs .h{display:flex;gap:10px;align-items:flex-start}.cs .e{font-size:26px;line-height:1.1}.cs .t{font-weight:600}.cs .d{margin:4px 0 0;color:var(--ink-2)}.cs .l{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}.cs .l a{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;text-decoration:none;background:var(--bg)}.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--android)}.av{padding:10px 0;border-bottom:1px solid var(--line)}.av:last-child{border-bottom:0}.av .top{display:flex;justify-content:space-between;gap:12px}footer{margin-top:40px;font-size:13px;color:var(--ink-2)}a{color:inherit}</style></head><body><div class="wrap">

<footer id="foot"></footer></div><script>var D={"genere":"2026-09-29T20:08:43.050Z","formateur":"M. Goumih — OFPPT CMC Agadir","groups":[{"id":"devoam201","nom":"DEVOAM201","edt":[{"jour":"Lundi","creneaux":[{"debut":"08:00","fin":"13:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Mardi","creneaux":[{"debut":"13:30","fin":"18:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Mercredi","creneaux":[{"debut":"08:00","fin":"13:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Jeudi","creneaux":[{"debut":"13:30","fin":"18:30","salle":"DIA7","remarque":"","freq":""}]},{"jour":"Samedi","creneaux":[{"debut":"08:00","fin":"13:00","salle":"DIA7","remarque":"","freq":""}]}]}],"avancement":[{"code":"M202","libelle":"Programmation sous Android","groupId":"devoam201","pct":79,"fait":71.5,"mh":90}],"consignes":[{"titre":"preparation Tps","emoji":"🛠️","type":"TP à rendre","desc":"pour la séance de jeudi vos préparer vos codes pour expliquer  les solutions avec aussi solutions alrenatives  et les questions de vos collègues et votre formateur","date":"2026-10-01","groupIds":["devoam201"],"liens":[]}],"corrections":[{"code":"EP20","titre":"Liste imbriquée : flatMap, forEach et asSequence","cours":"Kotlin","date":"2026-09-29","groupIds":["devoam201"],"resume":"L'objectif est de résoudre un problème avec une liste imbriquée contenant différents éléments, en trouvant la première occurrence d'un élément particulier. Nous avons une structure de données où chaque objet Team contient une liste de Players. - Chaque Player …","correction":"// EP20 — Liste imbriquée : trouver la première occurrence (flatMap, forEach, asSequence)\n\n// 201. Les classes Player et Team\ndata class Player(val name: String, val score: Int)\ndata class Team(val name: String, val players: List<Player>)\n\n// 202. Données d'exemple\nval teams = listOf(\n    Team(\"Raja\", listOf(Player(\"Ahmed\", 45), Player(\"Youssef\", 120), Player(\"Karim\", 80))),\n    Team(\"Wydad\", listOf(Player(\"Omar\", 150), Player(\"Hamza\", 30))),\n    Team(\"Hassania\", listOf(Player(\"Said\", 99), Player(\"Anas\", 101)))\n)\n\n// 203. Premier joueur avec un score > 100 : flatMap() puis first()\nfun premierAvecFlatMap(teams: List<Team>): Player =\n    teams.flatMap { it.players }.first { it.score > 100 }\n\n// 204. Même solution avec des traces pour voir le parcours :\n// flatMap construit d'abord la liste COMPLÈTE de tous les joueurs, puis first() la parcourt.\nfun premierAvecFlatMapTrace(teams: List<Team>): Player =\n    teams.flatMap { t ->\n        println(\"  flatMap : copie des joueurs de ${t.name}\")\n        t.players\n    }.first { p ->\n        println(\"  first : test de ${p.name} (${p.score})\")\n        p.score > 100\n    }\n\n// 205. forEach imbriqués : on s'arrête dès qu'on trouve (return non local)\nfun premierAvecForEach(teams: List<Team>): Player? {\n    teams.forEach { t ->\n        t.players.forEach { p ->\n            println(\"  forEach : test de ${p.name} (${p.score})\")\n            if (p.score > 100) return p\n        }\n    }\n    return null\n}\n\n// 206. asSequence() : évaluation paresseuse, élément par élément, arrêt au premier trouvé\nfun premierAvecSequence(teams: List<Team>): Player? =\n    teams.asSequence()\n        .flatMap { t ->\n            println(\"  sequence : ouverture de ${t.name}\")\n            t.players.asSequence()\n        }\n        .firstOrNull { p ->\n            println(\"  sequence : test de ${p.name} (${p.score})\")\n            p.score > 100\n        }\n\nfun main() {\n    println(\"203 → \" + premierAvecFlatMap(teams))\n    println(\"204 (flatMap + first) :\")\n    println(\"→ \" + premierAvecFlatMapTrace(teams))\n    println(\"205 (forEach imbriqué) :\")\n    println(\"→ \" + premierAvecForEach(teams))\n    println(\"206 (asSequence) :\")\n    println(\"→ \" + premierAvecSequence(teams))\n}\n"}],"supplements":[{"titre":"UML → Kotlin","date":"2026-09-29","groupIds":["devoam201"],"html":"<h3>Diagramme de classes UML → KotlinModifiez le diagramme : le code Kotlin se met à jour et les lignes changées s&#39;allument.<\/h3><p>Glissez les classes. Cliquez sur une multiplicité pour la changer, sur une classe ou un trait pour le modifier.<\/p><h4>Mode d&#39;emploi<\/h4><p>+ Classe ajoute une classe. Les boutons Relier tracent une relation : cliquez ensuite sur les deux classes.<\/p><p>Cliquez sur une classe pour modifier son nom, ses attributs et ses méthodes, ou sur un trait pour changer le type de relation, la navigabilité et les multiplicités.<\/p><p>Touche Suppr : supprime l&#39;élément sélectionné.<\/p><h4>Notation<\/h4><p>+ public · - private · # protected · ~ internal<\/p><p>Attribut {readOnly} → val, sinon var. Membre souligné → companion object. Nom ou méthode en italique → abstrait.<\/p><p>Multiplicités : 1 exactement un · 0..1 au plus un · * zéro ou plusieurs · 1..* au moins un.<\/p><pre>// Code généré à partir du diagramme de classes UMLclass Auteur(private var nom: String = &quot;&quot;, private var nationalite: String = &quot;&quot;) {    // Association bidirectionnelle vers Livre [*]    val livres: MutableList&lt;Livre&gt; = mutableListOf()    fun presenter() {        // à compléter    }    // Garde les deux côtés cohérents    fun ajouterLivre(livre: Livre) {        livres += livre        livre.auteur = this    }}class Livre(private var titre: String = &quot;&quot;, private var annee: Int = 0) {    // Association bidirectionnelle vers Auteur [1]    // lateinit : le lien est posé après la création (bidirectionnelle)    lateinit var auteur: Auteur    fun resume(): String = TODO(&quot;à compléter&quot;)}<\/pre>"},{"titre":"Scope functions Kotlin","date":"2026-09-29","groupIds":["devoam201"],"html":"<h3>Kotlin — les scope functions<\/h3><p>Cinq fonctions (let, run, with, apply, also) qui exécutent un bloc de code dans le contexte d’un objet. Deux questions suffisent pour les distinguer : comment on nomme l’objet dans le bloc (it ou this), et ce que renvoie la fonction (le résultat du bloc ou l’objet lui-même).<\/p><div class=\"tw\"><table><tr><th>Fonction<\/th><th>Objet dans le bloc<\/th><th>Renvoie<\/th><th>Usage typique<\/th><\/tr><tr><td>let<\/td><td>it<\/td><td>résultat du bloc<\/td><td>transformer, traiter un nullable avec ?.let<\/td><\/tr><tr><td>run<\/td><td>this<\/td><td>résultat du bloc<\/td><td>calculer une valeur à partir d’un objet<\/td><\/tr><tr><td>with<\/td><td>this<\/td><td>résultat du bloc<\/td><td>comme run, sans le point, objet non nullable<\/td><\/tr><tr><td>apply<\/td><td>this<\/td><td>l’objet<\/td><td>configurer / initialiser un objet<\/td><\/tr><tr><td>also<\/td><td>it<\/td><td>l’objet<\/td><td>effet de bord : journal, validation, ajout<\/td><\/tr><\/table><\/div><h4>let — objet : it · renvoie : résultat du bloc<\/h4><p>Objet = it, renvoie le résultat. Idéal pour transformer une valeur, souvent avec ?. pour ne traiter que le cas non-null. Le résultat est la dernière expression du bloc.<\/p><pre>val nom: String? = &quot;Goumih&quot;\nval taille = nom?.let {\n    println(&quot;Traitement de $it&quot;)\n    it.length          // dernière expression = résultat\n}\nprintln(&quot;taille = $taille&quot;)<\/pre><ul><li>On déclare une chaîne nullable.<\/li><li>nom n&#39;est pas null → le bloc let s&#39;exécute, it = &quot;Goumih&quot;.<\/li><li>Effet dans le bloc. → affiche : Traitement de Goumih<\/li><li>La dernière expression (it.length = 6) devient la valeur renvoyée.<\/li><li>taille vaut 6 (un Int?, null si nom l&#39;était). → affiche : taille = 6<\/li><\/ul><h4>run — objet : this · renvoie : résultat du bloc<\/h4><p>Objet = this (implicite), renvoie le résultat. On appelle les membres directement, comme à l&#39;intérieur de la classe, pour calculer une valeur. with(obj) { } fait la même chose sans le point : on l&#39;emploie quand l&#39;objet n&#39;est pas nullable.<\/p><pre>data class Rect(var l: Int, var h: Int)\nval r = Rect(4, 3)\nval aire = r.run {\n    l = l + 1          // this.l, implicite\n    l * h              // résultat renvoyé\n}\nprintln(&quot;aire = $aire, l = ${r.l}&quot;)<\/pre><ul><li>Un rectangle 4 × 3.<\/li><li>run : dans le bloc, this = r.<\/li><li>On modifie l via this (implicite) : l = 5.<\/li><li>Dernière expression : 5 × 3 = 15, renvoyée par run.<\/li><li>aire = 15 ; r a bien été modifié. → affiche : aire = 15, l = 5<\/li><\/ul><h4>with — objet : this · renvoie : résultat du bloc<\/h4><p>with(obj) { } = run sans le point. Même receiver implicite, même valeur de retour. On le lit « avec cet objet, faire… ». Il ne se chaîne pas et ne gère pas le null : préférez run pour obj?.run { }.<\/p><pre>val liste = mutableListOf(&quot;a&quot;, &quot;b&quot;)\nval phrase = with(liste) {\n    add(&quot;c&quot;)           // this.add\n    println(&quot;taille $size&quot;)\n    joinToString(&quot;-&quot;) // résultat\n}\nprintln(phrase)<\/pre><ul><li>Une liste modifiable.<\/li><li>with(liste) : this = liste dans le bloc.<\/li><li>Ajout de &quot;c&quot;.<\/li><li>size est lu sur this. → affiche : taille 3<\/li><li>Dernière expression : &quot;a-b-c&quot; renvoyée.<\/li><li>phrase = &quot;a-b-c&quot;. → affiche : a-b-c<\/li><\/ul><h4>apply — objet : this · renvoie : l&#39;objet lui-même<\/h4><p>Objet = this, renvoie l&#39;objet. La fonction de configuration : on règle plusieurs propriétés puis on récupère l&#39;objet prêt. Très courant sur Android (Intent().apply { … }, TextView.apply { … }).<\/p><pre>class Bouton { var texte = &quot;&quot;; var largeur = 0 }\nval btn = Bouton().apply {\n    texte = &quot;Valider&quot;  // this.texte\n    largeur = 120\n}   // apply renvoie le Bouton\nprintln(&quot;${btn.texte} (${btn.largeur})&quot;)<\/pre><ul><li>Une classe avec deux propriétés.<\/li><li>Bouton() crée l&#39;objet ; apply ouvre un bloc où this = ce bouton.<\/li><li>Configuration via this implicite.<\/li><li>Seconde propriété.<\/li><li>apply renvoie le bouton lui-même → btn.<\/li><li>L&#39;objet est prêt à l&#39;emploi. → affiche : Valider (120)<\/li><\/ul><h4>also — objet : it · renvoie : l&#39;objet lui-même<\/h4><p>Objet = it, renvoie l&#39;objet. Pour un effet de bord (journal, validation, ajout à une collection) au milieu d&#39;une chaîne d&#39;appels, sans changer ce qui circule. « … et aussi, fais ceci ».<\/p><pre>val notes = mutableListOf&lt;Int&gt;()\nval n = (14 + 3)\n    .also { println(&quot;valeur calculée : $it&quot;) }\n    .also { notes.add(it) }\nprintln(&quot;n = $n, notes = $notes&quot;)<\/pre><ul><li>Une liste vide.<\/li><li>17 est calculé.<\/li><li>also : it = 17, on journalise ; renvoie 17. → affiche : valeur calculée : 17<\/li><li>Second also : on ajoute 17 à la liste ; renvoie encore 17.<\/li><li>n vaut toujours 17 : also n&#39;a rien changé. → affiche : n = 17, notes = [17]<\/li><\/ul><h4>Laquelle choisir ?<\/h4><ul><li>Je veux récupérer le même objet et le configurer avec ses membres → apply<\/li><li>Je veux récupérer le même objet et faire une action annexe avec it → also<\/li><li>Je veux un nouveau résultat, objet nommé it (souvent ?.let) → let<\/li><li>Je veux un nouveau résultat avec this implicite → run (ou with(obj) sans chaînage)<\/li><\/ul><h4>Exercices corrigés<\/h4><ul><li>1. Que renvoie &quot;abc&quot;.let { it.length } ? — Réponse : 3. let renvoie le résultat du bloc : it.length = 3.<\/li><li>2. Que renvoie &quot;abc&quot;.also { println(it) } ? — Réponse : &quot;abc&quot;. also renvoie toujours l&#39;objet receveur, quoi que fasse le bloc.<\/li><li>3. Dans obj.apply { … }, comment accède-t-on à l&#39;objet ? — Réponse : this (implicite). apply (comme run et with) prend un receiver : this, souvent omis.<\/li><li>4. Quelle fonction pour initialiser un Intent avec plusieurs extras ? — Réponse : apply. apply : on configure via this et on récupère l&#39;Intent.<\/li><li>5. val x = p?.run { age + 1 } — si p est null, x vaut : — Réponse : null. Avec ?. le bloc n&#39;est pas exécuté : x = null.<\/li><li>6. Quelle différence entre run et with ? — Réponse : Aucune, syntaxe différente seulement. Même sémantique (this, résultat) ; with(obj) { } s&#39;écrit sans point et ne gère pas le null.<\/li><li>7. Pour journaliser une valeur au milieu d&#39;une chaîne d&#39;appels sans la modifier : — Réponse : also. also : effet de bord avec it, l&#39;objet continue la chaîne inchangé.<\/li><li>8. val r = Rect(2,3).apply { l = 10 }.run { l * h } — r vaut : — Réponse : 30. apply renvoie le Rect modifié (l=10), run calcule 10 × 3 = 30.<\/li><\/ul>"},{"titre":"Kotlin ⇄ Java","date":"2026-09-29","groupIds":["devoam201"],"html":"<h3>Kotlin ⇄ Java — syntaxe et méthodes<\/h3><p>Kotlin tourne sur la même machine virtuelle que Java et utilise les mêmes bibliothèques : ce qui change, c’est la façon d’écrire. Pour chaque thème : le code Kotlin, son équivalent Java, les correspondances clés et l’essentiel à retenir.<\/p><h4>Variables &amp; types<\/h4><h5>Kotlin<\/h5><pre>val nom = &quot;Amina&quot;        // lecture seule\nvar age: Int = 20        // modifiable\nage += 1\nval pi = 3.14            // type inféré : Double<\/pre><h5>Java<\/h5><pre>final String nom = &quot;Amina&quot;;   // lecture seule\nint age = 20;                 // modifiable\nage += 1;\nfinal double pi = 3.14;       // type écrit (ou var)<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>val<\/td><td>final<\/td><td>val = référence non réaffectable, comme final en Java.<\/td><\/tr><tr><td>var age: Int<\/td><td>int age<\/td><td>En Kotlin le type vient après le nom (et il est souvent facultatif) ; en Java il vient avant.<\/td><\/tr><tr><td>age += 1<\/td><td>age += 1;<\/td><td>Pas de point-virgule en Kotlin.<\/td><\/tr><\/table><\/div><ul><li>Kotlin déduit le type à partir de la valeur ; Java n’a « var » que depuis Java 10, pour les variables locales.<\/li><li>Préférez val par défaut, var seulement si la valeur doit changer.<\/li><li>Int, Double, Boolean… sont des classes en Kotlin, compilées en types primitifs quand c’est possible.<\/li><\/ul><h4>Null safety<\/h4><h5>Kotlin<\/h5><pre>var email: String? = null\nval n = email?.length ?: 0\nprintln(n)\nemail = &quot;a@b.ma&quot;\nprintln(email!!.length)<\/pre><h5>Java<\/h5><pre>String email = null;\nint n = (email != null) ? email.length() : 0;\nSystem.out.println(n);\nemail = &quot;a@b.ma&quot;;\nSystem.out.println(email.length()); // NPE possible<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>String?<\/td><td>String email<\/td><td>Le ? autorise null. Sans ?, le compilateur Kotlin interdit null ; en Java, tout objet peut être null.<\/td><\/tr><tr><td>?.<\/td><td>!= null<\/td><td>Appel sûr : renvoie null au lieu de planter.<\/td><\/tr><tr><td>?: 0<\/td><td>: 0<\/td><td>Opérateur Elvis : valeur par défaut si null.<\/td><\/tr><tr><td>!!<\/td><td>// NPE possible<\/td><td>!! force l’appel : NullPointerException si la valeur est null, comme en Java.<\/td><\/tr><\/table><\/div><ul><li>Le plus grand gain de Kotlin : les NullPointerException sont détectées à la compilation.<\/li><li>String et String? sont deux types différents.<\/li><li>Évitez !! : préférez ?., ?: ou un test if (x != null), après lequel Kotlin fait un smart cast.<\/li><\/ul><h4>Fonctions<\/h4><h5>Kotlin<\/h5><pre>fun aire(l: Double, h: Double = 1.0): Double {\n    return l * h\n}\nfun carre(x: Int) = x * x\n\naire(3.0)                 // h = 1.0\naire(h = 2.0, l = 4.0)    // arguments nommés<\/pre><h5>Java<\/h5><pre>static double aire(double l, double h) {\n    return l * h;\n}\nstatic double aire(double l) {      // surcharge\n    return aire(l, 1.0);\n}\nstatic int carre(int x) { return x * x; }\n\naire(3.0);\naire(4.0, 2.0);   // pas d’arguments nommés<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>fun<\/td><td>static<\/td><td>Mot-clé fun. En Java, toute méthode appartient à une classe ; Kotlin autorise les fonctions de premier niveau.<\/td><\/tr><tr><td>h: Double = 1.0<\/td><td>// surcharge<\/td><td>Valeur par défaut au lieu d’écrire une surcharge.<\/td><\/tr><tr><td>= x * x<\/td><td>{ return x * x; }<\/td><td>Corps-expression : une fonction d’une ligne sans accolades ni return.<\/td><\/tr><tr><td>h = 2.0, l = 4.0<\/td><td>aire(4.0, 2.0)<\/td><td>Arguments nommés, dans n’importe quel ordre.<\/td><\/tr><\/table><\/div><ul><li>Syntaxe : fun nom(param: Type): TypeRetour.<\/li><li>Unit (Kotlin) correspond à void (Java) et peut être omis.<\/li><li>Valeurs par défaut + arguments nommés remplacent la plupart des surcharges.<\/li><\/ul><h4>Chaînes &amp; templates<\/h4><h5>Kotlin<\/h5><pre>val nom = &quot;Sara&quot;\nval n = 3\nprintln(&quot;Bonjour $nom, $n messages&quot;)\nprintln(&quot;Total : ${n * 10} DH&quot;)\nval txt = &quot;&quot;&quot;\n    Ligne 1\n    Ligne 2\n&quot;&quot;&quot;.trimIndent()<\/pre><h5>Java<\/h5><pre>String nom = &quot;Sara&quot;;\nint n = 3;\nSystem.out.println(&quot;Bonjour &quot; + nom + &quot;, &quot; + n + &quot; messages&quot;);\nSystem.out.println(&quot;Total : &quot; + (n * 10) + &quot; DH&quot;);\nString txt = &quot;&quot;&quot;\n    Ligne 1\n    Ligne 2\n    &quot;&quot;&quot;;   // text block (Java 15)<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>$nom<\/td><td>+ nom +<\/td><td>Template : la variable est insérée dans la chaîne.<\/td><\/tr><tr><td>${n * 10}<\/td><td>(n * 10)<\/td><td>Une expression complète se met entre ${…}.<\/td><\/tr><tr><td>println<\/td><td>System.out.println<\/td><td>println est une fonction prête à l’emploi en Kotlin.<\/td><\/tr><tr><td>trimIndent()<\/td><td>text block<\/td><td>Chaînes multilignes avec triple guillemet.<\/td><\/tr><\/table><\/div><ul><li>Les templates évitent les + et les erreurs d’espaces.<\/li><li>&quot;%.2f&quot;.format(x) en Kotlin ↔ String.format(&quot;%.2f&quot;, x) en Java.<\/li><li>En Kotlin, == compare le contenu des chaînes ; en Java il faut equals().<\/li><\/ul><h4>if &amp; when<\/h4><h5>Kotlin<\/h5><pre>val max = if (a &gt; b) a else b\n\nval mention = when (note) {\n    in 16..20 -&gt; &quot;Très bien&quot;\n    in 12..15 -&gt; &quot;Bien&quot;\n    10, 11 -&gt; &quot;Passable&quot;\n    else -&gt; &quot;Ajourné&quot;\n}<\/pre><h5>Java<\/h5><pre>int max = (a &gt; b) ? a : b;\n\nString mention;\nif (note &gt;= 16 &amp;&amp; note &lt;= 20) mention = &quot;Très bien&quot;;\nelse if (note &gt;= 12 &amp;&amp; note &lt;= 15) mention = &quot;Bien&quot;;\nelse if (note == 10 || note == 11) mention = &quot;Passable&quot;;\nelse mention = &quot;Ajourné&quot;;<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>if (a &gt; b) a else b<\/td><td>(a &gt; b) ? a : b<\/td><td>if est une expression : pas d’opérateur ternaire en Kotlin.<\/td><\/tr><tr><td>when (note)<\/td><td>if (note<\/td><td>when remplace switch et les if en cascade.<\/td><\/tr><tr><td>in 16..20<\/td><td>note &gt;= 16 &amp;&amp; note &lt;= 20<\/td><td>Test d’appartenance à un intervalle.<\/td><\/tr><tr><td>10, 11<\/td><td>note == 10 || note == 11<\/td><td>Plusieurs valeurs dans une même branche.<\/td><\/tr><\/table><\/div><ul><li>when est une expression : il renvoie une valeur.<\/li><li>Pas de break : une branche ne « tombe » pas dans la suivante.<\/li><li>when accepte des intervalles (in), des types (is) et des conditions quelconques.<\/li><\/ul><h4>Boucles &amp; intervalles<\/h4><h5>Kotlin<\/h5><pre>for (i in 1..5) print(i)              // 12345\nfor (i in 0 until 5) print(i)         // 01234\nfor (i in 10 downTo 0 step 2) print(i)\nfor ((i, v) in listOf(&quot;a&quot;, &quot;b&quot;).withIndex())\n    println(&quot;$i=$v&quot;)\nrepeat(3) { println(&quot;Hop&quot;) }<\/pre><h5>Java<\/h5><pre>for (int i = 1; i &lt;= 5; i++) System.out.print(i);\nfor (int i = 0; i &lt; 5; i++) System.out.print(i);\nfor (int i = 10; i &gt;= 0; i -= 2) System.out.print(i);\nList&lt;String&gt; l = List.of(&quot;a&quot;, &quot;b&quot;);\nfor (int i = 0; i &lt; l.size(); i++)\n    System.out.println(i + &quot;=&quot; + l.get(i));\nfor (int k = 0; k &lt; 3; k++) System.out.println(&quot;Hop&quot;);<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>1..5<\/td><td>i &lt;= 5<\/td><td>Intervalle inclusif.<\/td><\/tr><tr><td>until<\/td><td>i &lt; 5<\/td><td>until exclut la borne de fin.<\/td><\/tr><tr><td>downTo 0 step 2<\/td><td>i -= 2<\/td><td>Décroissant, avec un pas.<\/td><\/tr><tr><td>withIndex()<\/td><td>l.get(i)<\/td><td>Indice et valeur en même temps.<\/td><\/tr><tr><td>repeat(3)<\/td><td>k &lt; 3<\/td><td>Répéter n fois.<\/td><\/tr><\/table><\/div><ul><li>Kotlin n’a pas de boucle for(init; cond; incr) : on parcourt un intervalle ou une collection.<\/li><li>for (x in liste) ↔ for (var x : liste) en Java.<\/li><li>while et do…while sont identiques dans les deux langages.<\/li><\/ul><h4>Classes &amp; propriétés<\/h4><h5>Kotlin<\/h5><pre>class Compte(val titulaire: String, var solde: Double = 0.0) {\n    fun deposer(m: Double) { solde += m }\n}\n\nval c = Compte(&quot;Ali&quot;)\nc.deposer(100.0)\nprintln(c.solde)<\/pre><h5>Java<\/h5><pre>class Compte {\n    private final String titulaire;\n    private double solde;\n\n    Compte(String titulaire, double solde) {\n        this.titulaire = titulaire;\n        this.solde = solde;\n    }\n    Compte(String titulaire) { this(titulaire, 0.0); }\n\n    public String getTitulaire() { return titulaire; }\n    public double getSolde() { return solde; }\n    public void setSolde(double s) { this.solde = s; }\n\n    void deposer(double m) { solde += m; }\n}\n\nCompte c = new Compte(&quot;Ali&quot;);\nc.deposer(100.0);\nSystem.out.println(c.getSolde());<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>val titulaire: String<\/td><td>private final String titulaire<\/td><td>Constructeur primaire : déclare et initialise les propriétés en une ligne.<\/td><\/tr><tr><td>var solde<\/td><td>setSolde<\/td><td>var génère getter et setter ; val seulement le getter.<\/td><\/tr><tr><td>Compte(&quot;Ali&quot;)<\/td><td>new Compte(&quot;Ali&quot;)<\/td><td>Pas de new en Kotlin.<\/td><\/tr><tr><td>c.solde<\/td><td>c.getSolde()<\/td><td>Lire une propriété appelle son getter.<\/td><\/tr><\/table><\/div><ul><li>Classes finales par défaut en Kotlin : il faut open pour hériter.<\/li><li>Visibilité par défaut : public en Kotlin, « package » en Java.<\/li><li>Héritage : class B : A() ↔ class B extends A.<\/li><\/ul><h4>Data class<\/h4><h5>Kotlin<\/h5><pre>data class Stagiaire(val nom: String, val note: Double)\n\nval a = Stagiaire(&quot;Ali&quot;, 14.5)\nval b = a.copy(note = 16.0)\nprintln(a)          // Stagiaire(nom=Ali, note=14.5)\nprintln(a == b)     // false : compare les valeurs\nval (nom, note) = b<\/pre><h5>Java<\/h5><pre>record Stagiaire(String nom, double note) {}\n// Avant Java 16 : champs, constructeur, getters,\n// equals(), hashCode() et toString() à écrire\n\nStagiaire a = new Stagiaire(&quot;Ali&quot;, 14.5);\nStagiaire b = new Stagiaire(a.nom(), 16.0);  // pas de copy()\nSystem.out.println(a);   // Stagiaire[nom=Ali, note=14.5]\nSystem.out.println(a.equals(b));\nString nom = b.nom(); double note = b.note();<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>data class<\/td><td>record<\/td><td>equals, hashCode, toString générés automatiquement.<\/td><\/tr><tr><td>copy(note = 16.0)<\/td><td>// pas de copy()<\/td><td>Copie avec une modification.<\/td><\/tr><tr><td>a == b<\/td><td>a.equals(b)<\/td><td>== compare le contenu en Kotlin ; === compare les références.<\/td><\/tr><tr><td>val (nom, note) = b<\/td><td>b.nom()<\/td><td>Déstructuration.<\/td><\/tr><\/table><\/div><ul><li>Une data class Kotlin reste modifiable si ses propriétés sont en var ; un record Java est toujours immuable.<\/li><li>copy() + arguments nommés : idéal pour les objets immuables.<\/li><\/ul><h4>Collections<\/h4><h5>Kotlin<\/h5><pre>val notes = listOf(12, 15, 9)          // lecture seule\nval panier = mutableListOf(&quot;pain&quot;)\npanier += &quot;lait&quot;\nval ages = mapOf(&quot;Ali&quot; to 20, &quot;Sara&quot; to 22)\nprintln(notes[0])\nprintln(ages[&quot;Sara&quot;])\nprintln(notes.size)<\/pre><h5>Java<\/h5><pre>List&lt;Integer&gt; notes = List.of(12, 15, 9);    // immuable\nList&lt;String&gt; panier = new ArrayList&lt;&gt;(List.of(&quot;pain&quot;));\npanier.add(&quot;lait&quot;);\nMap&lt;String, Integer&gt; ages = Map.of(&quot;Ali&quot;, 20, &quot;Sara&quot;, 22);\nSystem.out.println(notes.get(0));\nSystem.out.println(ages.get(&quot;Sara&quot;));\nSystem.out.println(notes.size());<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>listOf<\/td><td>List.of<\/td><td>Liste en lecture seule.<\/td><\/tr><tr><td>mutableListOf<\/td><td>new ArrayList&lt;&gt;<\/td><td>Liste modifiable.<\/td><\/tr><tr><td>+=<\/td><td>.add(<\/td><td>Opérateurs sur les collections.<\/td><\/tr><tr><td>&quot;Ali&quot; to 20<\/td><td>&quot;Ali&quot;, 20<\/td><td>to crée une paire clé-valeur.<\/td><\/tr><tr><td>notes[0]<\/td><td>notes.get(0)<\/td><td>Accès indexé avec [ ].<\/td><\/tr><tr><td>.size<\/td><td>.size()<\/td><td>Propriété en Kotlin, méthode en Java.<\/td><\/tr><\/table><\/div><ul><li>Kotlin sépare les interfaces lecture seule (List) et modifiables (MutableList).<\/li><li>Le type List&lt;Int&gt; suffit : pas de Integer en Kotlin.<\/li><\/ul><h4>Lambdas &amp; opérations<\/h4><h5>Kotlin<\/h5><pre>val notes = listOf(8, 14, 17, 11)\nval admis = notes.filter { it &gt;= 10 }\nval bonus = admis.map { it + 1 }\nval moyenne = notes.average()\nnotes.forEach { println(it) }\nval maxi = notes.maxOrNull() ?: 0<\/pre><h5>Java<\/h5><pre>List&lt;Integer&gt; notes = List.of(8, 14, 17, 11);\nList&lt;Integer&gt; admis = notes.stream().filter(n -&gt; n &gt;= 10).toList();\nList&lt;Integer&gt; bonus = admis.stream().map(n -&gt; n + 1).toList();\ndouble moyenne = notes.stream().mapToInt(Integer::intValue).average().orElse(0);\nnotes.forEach(n -&gt; System.out.println(n));\nint maxi = notes.stream().max(Integer::compare).orElse(0);<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>filter { it &gt;= 10 }<\/td><td>filter(n -&gt; n &gt;= 10)<\/td><td>Les opérations s’appellent directement sur la liste : pas de stream().<\/td><\/tr><tr><td>it<\/td><td>n -&gt;<\/td><td>it : nom implicite du paramètre unique d’une lambda.<\/td><\/tr><tr><td>average()<\/td><td>orElse(0)<\/td><td>Fonctions prêtes à l’emploi.<\/td><\/tr><tr><td>maxOrNull() ?: 0<\/td><td>orElse(0)<\/td><td>null + Elvis au lieu d’Optional.<\/td><\/tr><\/table><\/div><ul><li>Lambda Kotlin : { x -&gt; x * 2 } ; Java : x -&gt; x * 2.<\/li><li>Si la lambda est le dernier argument, elle se place hors des parenthèses : liste.filter { … }.<\/li><\/ul><h4>Fonctions d’extension<\/h4><h5>Kotlin<\/h5><pre>fun String.initiales(): String =\n    split(&quot; &quot;).joinToString(&quot;&quot;) { it.first().uppercase() }\n\nfun Double.enDH() = &quot;%.2f DH&quot;.format(this)\n\nprintln(&quot;mohamed goumih&quot;.initiales())   // MG\nprintln(149.5.enDH())                   // 149,50 DH<\/pre><h5>Java<\/h5><pre>class Utils {\n    static String initiales(String s) {\n        StringBuilder sb = new StringBuilder();\n        for (String m : s.split(&quot; &quot;))\n            sb.append(Character.toUpperCase(m.charAt(0)));\n        return sb.toString();\n    }\n    static String enDH(double d) { return String.format(&quot;%.2f DH&quot;, d); }\n}\nSystem.out.println(Utils.initiales(&quot;mohamed goumih&quot;));\nSystem.out.println(Utils.enDH(149.5));<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>String.initiales()<\/td><td>initiales(String s)<\/td><td>Extension : on « ajoute » une méthode à String sans la modifier.<\/td><\/tr><tr><td>this<\/td><td>double d<\/td><td>this désigne l’objet sur lequel on appelle l’extension.<\/td><\/tr><tr><td>&quot;mohamed goumih&quot;.initiales()<\/td><td>Utils.initiales(&quot;mohamed goumih&quot;)<\/td><td>On l’appelle comme une méthode de l’objet.<\/td><\/tr><\/table><\/div><ul><li>Compilée en méthode static : aucune différence de performance.<\/li><li>Très utilisé sur Android (View, Context…).<\/li><\/ul><h4>object &amp; companion<\/h4><h5>Kotlin<\/h5><pre>object Config {\n    val version = &quot;1.0&quot;\n    fun info() = &quot;GoumihEdu $version&quot;\n}\n\nclass Stagiaire private constructor(val nom: String) {\n    companion object {\n        fun creer(nom: String) = Stagiaire(nom.trim())\n    }\n}\nprintln(Config.info())\nval s = Stagiaire.creer(&quot;  Ali &quot;)<\/pre><h5>Java<\/h5><pre>final class Config {\n    static final String version = &quot;1.0&quot;;\n    private Config() {}\n    static String info() { return &quot;GoumihEdu &quot; + version; }\n}\n\nclass Stagiaire {\n    private final String nom;\n    private Stagiaire(String nom) { this.nom = nom; }\n    static Stagiaire creer(String nom) { return new Stagiaire(nom.trim()); }\n}\nSystem.out.println(Config.info());\nStagiaire s = Stagiaire.creer(&quot;  Ali &quot;);<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>object Config<\/td><td>final class Config<\/td><td>Singleton en une déclaration.<\/td><\/tr><tr><td>companion object<\/td><td>static Stagiaire creer<\/td><td>Kotlin n’a pas de static : on passe par le companion object.<\/td><\/tr><tr><td>private constructor<\/td><td>private Stagiaire(<\/td><td>Constructeur privé + méthode fabrique.<\/td><\/tr><\/table><\/div><ul><li>object crée la classe et son instance unique.<\/li><li>const val (Kotlin) ↔ static final (Java) pour les constantes.<\/li><\/ul><h4>Smart cast<\/h4><h5>Kotlin<\/h5><pre>fun decrire(x: Any): String {\n    if (x is String) return &quot;Texte de ${x.length} lettres&quot;\n    return when (x) {\n        is Int -&gt; &quot;Entier ${x + 1}&quot;\n        is List&lt;*&gt; -&gt; &quot;Liste de ${x.size}&quot;\n        else -&gt; &quot;Autre&quot;\n    }\n}<\/pre><h5>Java<\/h5><pre>static String decrire(Object x) {\n    if (x instanceof String s) return &quot;Texte de &quot; + s.length() + &quot; lettres&quot;;\n    if (x instanceof Integer i) return &quot;Entier &quot; + (i + 1);\n    if (x instanceof List&lt;?&gt; l) return &quot;Liste de &quot; + l.size();\n    return &quot;Autre&quot;;\n}\n// Avant Java 16 : String s = (String) x;<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>is String<\/td><td>instanceof String s<\/td><td>Test de type.<\/td><\/tr><tr><td>x.length<\/td><td>s.length()<\/td><td>Smart cast : après le test, x est déjà un String, sans conversion.<\/td><\/tr><tr><td>Any<\/td><td>Object<\/td><td>Type racine de tous les objets.<\/td><\/tr><\/table><\/div><ul><li>Conversion explicite : x as String (Kotlin) ↔ (String) x (Java).<\/li><li>x as? String renvoie null au lieu de lever une exception.<\/li><\/ul><h4>Exceptions<\/h4><h5>Kotlin<\/h5><pre>fun lire(txt: String): Int {\n    val n = try {\n        txt.toInt()\n    } catch (e: NumberFormatException) {\n        0\n    }\n    return n\n}\nval m = &quot;12&quot;.toIntOrNull() ?: -1<\/pre><h5>Java<\/h5><pre>static int lire(String txt) {\n    int n;\n    try {\n        n = Integer.parseInt(txt);\n    } catch (NumberFormatException e) {\n        n = 0;\n    }\n    return n;\n}\nInteger v = null;\ntry { v = Integer.parseInt(&quot;12&quot;); } catch (NumberFormatException e) {}\nint m = (v != null) ? v : -1;<\/pre><div class=\"tw\"><table><tr><th>Kotlin<\/th><th>Java<\/th><th>Explication<\/th><\/tr><tr><td>val n = try<\/td><td>int n;<\/td><td>try est une expression : il renvoie une valeur.<\/td><\/tr><tr><td>e: NumberFormatException<\/td><td>NumberFormatException e<\/td><td>Le type après le nom, comme partout en Kotlin.<\/td><\/tr><tr><td>toIntOrNull()<\/td><td>Integer.parseInt<\/td><td>Variante qui renvoie null au lieu de lever une exception.<\/td><\/tr><\/table><\/div><ul><li>Pas d’exceptions vérifiées (checked) en Kotlin : aucun throws obligatoire.<\/li><li>Pour Java, @Throws(IOException::class) documente l’exception.<\/li><\/ul><h4>Exercices corrigés<\/h4><ul><li>1. Équivalent Java de val x = 10 ? — Réponse : final int x = 10;. val = référence non réaffectable, comme final.<\/li><li>2. Ce code est du… [System.out.println(nom.length());] — Réponse : Java. Kotlin écrirait println(nom.length) : length est une propriété et println une fonction directe.<\/li><li>3. Si name vaut null, que vaut name?.length ?: 0 ? — Réponse : 0. ?. renvoie null, puis Elvis ?: remplace null par 0.<\/li><li>4. Quel mot-clé Kotlin remplace switch ? — Réponse : when. when, qui est aussi une expression.<\/li><li>5. Que parcourt for (i in 0 until 3) ? — Réponse : 0, 1, 2. until exclut la borne de fin, comme i &lt; 3 en Java.<\/li><li>6. En Kotlin, comment compare-t-on le contenu de deux objets ? — Réponse : ==. == appelle equals() ; === compare les références (le == de Java sur les objets).<\/li><li>7. Comment créer un objet en Kotlin ? — Réponse : Personne(&quot;Ali&quot;). Pas de mot-clé new en Kotlin.<\/li><li>8. Que génère une data class ? — Réponse : equals, hashCode, toString, copy et componentN. C’est l’équivalent enrichi d’un record Java.<\/li><li>9. Nom implicite du paramètre unique d’une lambda Kotlin ? — Réponse : it. liste.filter { it &gt; 2 } ↔ liste.stream().filter(x -&gt; x &gt; 2).<\/li><li>10. Exceptions vérifiées (checked) : — Réponse : Kotlin n’oblige jamais à les déclarer. Kotlin n’a pas de throws obligatoire ; Java impose de traiter ou déclarer les checked exceptions.<\/li><li>11. Équivalent Kotlin de static dans une classe ? — Réponse : companion object. Les membres « statiques » se déclarent dans le companion object.<\/li><li>12. Que fait fun String.cri() = uppercase() + &quot;!&quot; ? — Réponse : Ajoute une méthode cri() utilisable sur toute String. Fonction d’extension : &quot;salut&quot;.cri() donne &quot;SALUT!&quot;.<\/li><\/ul>"},{"titre":"Injection de dépendances","date":"2026-09-29","groupIds":["devoam201"],"html":"<h3>L’injection de dépendances en Kotlin<\/h3><p>Une classe ne fabrique pas elle-même les objets dont elle a besoin (base de données, envoi de messages, journal…) : on les lui fournit de l’extérieur, le plus souvent par son constructeur. Le code devient interchangeable, testable et plus simple à faire évoluer.<\/p><h4>1. Le problème : le couplage fort<\/h4><h5>Sans injection<\/h5><pre>class CommandeService {\n    // La classe fabrique elle-même ses dépendances\n    private val repo = MySqlCommandeRepository()\n    private val notif = EmailNotificateur()\n\n    fun passer(client: String, total: Double) {\n        val c = Commande(client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nfun main() {\n    val service = CommandeService()   // aucun choix possible ici\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><p class=\"nt\">Pour changer de base de données, il faut modifier CommandeService ; en test, impossible d’éviter la vraie base et l’envoi d’e-mails.<\/p><h5>Avec injection<\/h5><pre>interface CommandeRepository { fun sauvegarder(c: Commande) }\ninterface Notificateur { fun envoyer(dest: String, msg: String) }\n\nclass CommandeService(\n    private val repo: CommandeRepository,   // reçu, pas créé\n    private val notif: Notificateur\n) {\n    fun passer(client: String, total: Double) {\n        val c = Commande(client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nfun main() {\n    val service = CommandeService(MySqlCommandeRepository(), EmailNotificateur())\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><p class=\"nt\">CommandeService dépend d’interfaces ; seul main choisit les classes concrètes.<\/p><h4>2. L’assembleur (composition root)<\/h4><pre>class CommandeService(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur,\n    private val journal: Journal\n) {\n    fun passer(client: String, total: Double): Commande {\n        journal.log(&quot;Nouvelle commande de $client&quot;)\n        val c = Commande(id = repo.prochainId(), client, total)\n        repo.sauvegarder(c)\n        notif.envoyer(client, &quot;Commande #${c.id} confirmée&quot;)\n        return c\n    }\n}\n\n// Assembleur (composition root) : le SEUL endroit qui connaît les classes concrètes\nfun main() {\n    val repo: CommandeRepository = MySqlCommandeRepository(&quot;jdbc:mysql://localhost/resto&quot;)\n    val notif: Notificateur = EmailNotificateur()\n    val journal: Journal = ConsoleJournal()\n\n    val service = CommandeService(repo, notif, journal)\n    service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><h4>3. Trois façons d’injecter<\/h4><h5>Par constructeur<\/h5><pre>class CommandeService(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur\n) {\n    fun passer(client: String, total: Double) { /* … */ }\n}\n\nval service = CommandeService(MySqlCommandeRepository(), EmailNotificateur())<\/pre><p>La méthode recommandée. Les dépendances sont visibles dans la signature, obligatoires et non modifiables (val) : l’objet est complet dès sa création.<\/p><ul><li>Avantage : Impossible d’oublier une dépendance<\/li><li>Avantage : Propriétés en val, objet immuable<\/li><li>Avantage : Test direct : on passe des faux au constructeur<\/li><li>Limite : Constructeur long si beaucoup de dépendances (signe qu’une classe en fait trop)<\/li><\/ul><h5>Par propriété<\/h5><pre>class CommandeService {\n    lateinit var repo: CommandeRepository\n    lateinit var notif: Notificateur\n\n    fun passer(client: String, total: Double) { /* … */ }\n}\n\nval service = CommandeService()\nservice.repo = MySqlCommandeRepository()\nservice.notif = EmailNotificateur()<\/pre><p>Utile quand on ne contrôle pas la création de l’objet (Activity ou Fragment Android créés par le système) : le framework remplit la propriété après coup (@Inject lateinit var avec Hilt).<\/p><ul><li>Avantage : Seule option quand le système crée l’objet<\/li><li>Limite : Oubli possible : UninitializedPropertyAccessException à l’exécution<\/li><li>Limite : Propriété modifiable (var)<\/li><\/ul><h5>Par méthode / paramètre<\/h5><pre>class CommandeService {\n    fun passer(\n        client: String,\n        total: Double,\n        repo: CommandeRepository,\n        notif: Notificateur\n    ) {\n        repo.sauvegarder(Commande(client, total))\n        notif.envoyer(client, &quot;Commande confirmée&quot;)\n    }\n}\n\nservice.passer(&quot;Amina&quot;, 250.0, MySqlCommandeRepository(), EmailNotificateur())<\/pre><p>La dépendance n’est fournie que pour un appel. Pertinent quand elle change à chaque appel (un format d’export, une stratégie de calcul) : c’est le patron Stratégie.<\/p><ul><li>Avantage : Très flexible, appel par appel<\/li><li>Limite : Chaque appelant doit fournir les dépendances<\/li><li>Limite : Signatures chargées<\/li><\/ul><h4>4. Tester avec de fausses dépendances<\/h4><pre>class FauxRepository : CommandeRepository {\n    val sauvees = mutableListOf&lt;Commande&gt;()\n    override fun prochainId() = sauvees.size + 1\n    override fun sauvegarder(c: Commande) { sauvees += c }\n}\nclass FauxNotificateur : Notificateur {\n    val envoyes = mutableListOf&lt;String&gt;()\n    override fun envoyer(dest: String, msg: String) { envoyes += &quot;$dest : $msg&quot; }\n}\n\nclass CommandeServiceTest {\n    @Test\n    fun passerUneCommandeLaSauvegarde() {\n        val repo = FauxRepository()\n        val notif = FauxNotificateur()\n        val service = CommandeService(repo, notif, SilencieuxJournal())\n\n        service.passer(&quot;Amina&quot;, 250.0)\n\n        assertEquals(1, repo.sauvees.size)\n        assertEquals(250.0, repo.sauvees[0].total)\n        assertEquals(listOf(&quot;Amina : Commande #1 confirmée&quot;), notif.envoyes)\n    }\n}<\/pre><h4>5. Un conteneur fait maison<\/h4><pre>object Conteneur {\n    // single : créé au premier accès, puis toujours le même\n    val repo: CommandeRepository by lazy { EnMemoireCommandeRepository() }\n\n    // factory\n    fun notificateur(): Notificateur = EmailNotificateur()\n\n    val service by lazy {\n        CommandeService(repo, notificateur(), ConsoleJournal())\n    }\n}\n\nfun main() {\n    Conteneur.service.passer(&quot;Amina&quot;, 250.0)\n}<\/pre><ul><li>single (by lazy) : l’objet est créé au premier accès puis toujours réutilisé<\/li><li>factory (fun) : un nouvel objet à chaque appel<\/li><\/ul><h4>6. Avec un framework<\/h4><h5>Koin<\/h5><pre>// build.gradle.kts : implementation(&quot;io.insert-koin:koin-android:3.5.6&quot;)\n\nval appModule = module {\n    single&lt;CommandeRepository&gt; { RoomCommandeRepository(get()) }\n    factory&lt;Notificateur&gt; { EmailNotificateur() }\n    single&lt;Journal&gt; { ConsoleJournal() }\n    single { CommandeService(get(), get(), get()) }\n    viewModel { CommandeViewModel(get()) }\n}\n\nclass RestoApp : Application() {\n    override fun onCreate() {\n        super.onCreate()\n        startKoin {\n            androidContext(this@RestoApp)\n            modules(appModule)\n        }\n    }\n}\n\nclass CommandeActivity : AppCompatActivity() {\n    private val vm: CommandeViewModel by viewModel()\n}<\/pre><p>Koin décrit le graphe en Kotlin pur : single pour une instance unique, factory pour une nouvelle à chaque demande, get() pour résoudre une dépendance. Pas d’annotation ni de génération de code. En contrepartie, une dépendance oubliée n’est détectée qu’au lancement de l’application.<\/p><h5>Hilt<\/h5><pre>@HiltAndroidApp\nclass RestoApp : Application()\n\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class DonneesModule {\n    @Binds @Singleton\n    abstract fun repo(impl: RoomCommandeRepository): CommandeRepository\n    @Binds\n    abstract fun notif(impl: EmailNotificateur): Notificateur\n}\n\nclass CommandeService @Inject constructor(\n    private val repo: CommandeRepository,\n    private val notif: Notificateur\n)\n\n@HiltViewModel\nclass CommandeViewModel @Inject constructor(\n    private val service: CommandeService\n) : ViewModel()\n\n@AndroidEntryPoint\nclass CommandeActivity : AppCompatActivity() {\n    private val vm: CommandeViewModel by viewModels()\n}<\/pre><p>Hilt (basé sur Dagger) génère le code d’assemblage à la compilation : @Inject constructor dit comment créer une classe, @Binds ou @Provides relie une interface à son implémentation, @Singleton fixe la portée. Une dépendance manquante est une erreur de compilation. C’est la solution recommandée par Google pour Android.<\/p><h5>À la main (rappel)<\/h5><pre>object Conteneur {\n    val repo: CommandeRepository by lazy { EnMemoireCommandeRepository() }\n    fun notificateur(): Notificateur = EmailNotificateur()\n    val service by lazy { CommandeService(repo, notificateur(), ConsoleJournal()) }\n}\n\nclass CommandeActivity : AppCompatActivity() {\n    private val service = Conteneur.service\n}<\/pre><p>Les frameworks automatisent exactement ce que fait ce conteneur fait maison. Comprendre la version manuelle permet de comprendre Koin et Hilt : ils ne font rien de magique.<\/p><div class=\"tw\"><table><tr><th><\/th><th>À la main<\/th><th>Koin<\/th><th>Hilt (Dagger)<\/th><\/tr><tr><td>Principe<\/td><td>Constructeur + objet assembleur<\/td><td>DSL Kotlin : module { single { } factory { } }<\/td><td>Annotations (@Inject, @Module, @Provides), code généré<\/td><\/tr><tr><td>Vérification<\/td><td>À la compilation<\/td><td>À l’exécution (erreur au démarrage si une dépendance manque)<\/td><td>À la compilation<\/td><\/tr><tr><td>Mise en place<\/td><td>Aucune bibliothèque<\/td><td>Légère, rapide à apprendre<\/td><td>Plus lourde (kapt/ksp, plugin Gradle)<\/td><\/tr><tr><td>Idéal pour<\/td><td>Petits projets, apprendre le principe<\/td><td>Projets Kotlin / Android de taille moyenne, KMP<\/td><td>Grosses applications Android (recommandé par Google)<\/td><\/tr><\/table><\/div><h4>Exercices corrigés<\/h4><ul><li>1. Qu’est-ce qu’une dépendance d’une classe ? — Réponse : Un objet dont elle a besoin pour fonctionner. Ex. : CommandeService a besoin d’un repository et d’un notificateur.<\/li><li>2. Quelle forme d’injection est recommandée par défaut ? — Réponse : Par constructeur. Dépendances obligatoires, visibles, en val.<\/li><li>3. Pourquoi CommandeService doit-il dépendre d’une interface CommandeRepository ? — Réponse : Pour pouvoir changer d’implémentation sans modifier la classe. MySQL, Room ou une fausse base en test : même contrat.<\/li><li>4. Où doit-on créer les classes concrètes (MySql…, Email…) ? — Réponse : Dans l’assembleur (main, Application, module DI). C’est la « composition root ».<\/li><li>5. Dans Koin, que fait single { … } ? — Réponse : Fournit toujours la même instance. factory { } crée une nouvelle instance à chaque fois.<\/li><li>6. Que se passe-t-il avec by lazy dans un conteneur ? — Réponse : L’objet est créé au premier accès puis réutilisé. C’est un single « paresseux ».<\/li><li>7. Principal intérêt de l’injection pour les tests ? — Réponse : Remplacer les vraies dépendances par des fausses (fakes). Tests rapides, sans base ni réseau, et vérifiables.<\/li><li>8. Avec Hilt, que signifie @Inject constructor(…) ? — Réponse : Hilt sait créer cette classe en fournissant ses paramètres. La portée se fixe avec @Singleton ou un composant.<\/li><\/ul>"}],"parties":[{"id":"mun3np5o8afht","titre":"fonctions scopes kotlin","module":"M202 — Programmation sous Android","date":"2026-09-28","groupIds":["devoam201"],"stats":{"tot":0,"ok":0,"moins":0,"n":0},"importe":"29/09/2026 00:56:28"},{"id":"mulq33yukma1q","titre":"terminer POO kotlin","module":"M202 — Programmation sous Android","date":"2026-09-28","groupIds":["devoam201"],"stats":{"tot":0,"ok":1,"moins":0,"n":1},"importe":"29/09/2026 00:56:28"}],"fbform":{"action":"https://docs.google.com/forms/d/e/1FAIpQLScqMnYL1cf00nqEcj4BqiBztPjqpRHHlq5-HrzE5jiT4UzAdQ/formResponse",
